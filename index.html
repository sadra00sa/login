<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in page</title>
    <link rel="stylesheet" href="./style/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <form class="form" method="get" action="#">
                    <h2 class="form__title">login here</h2>
                    <div class="form__input-wrapper">
                          <label class="form__lable" for="username">username</label>
                          <input class="form__input" type="text" name="username" placeholder="email or phone" required/>
                    </div>
                    <div class="form__input-wrapper">
                            <label class="form__lable" for="password">password</label>
                            <input class="form__input" type="password" name="password" placeholder="password" required />
                    </div>
                    <button type="submit" class="form__submit-btn">log in</button>
        </form>
    </div>
  </body>
</html>
